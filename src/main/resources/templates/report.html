<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: A4; margin: 18mm 16mm; }
        body { font-family: Arial, sans-serif; color: #16202a; font-size: 12px; line-height: 1.6; }
        .cover { padding: 18px 22px; background: #f4efe4; border: 1px solid #d8ccb1; margin-bottom: 18px; }
        .eyebrow { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #855f1b; margin-bottom: 8px; }
        h1 { margin: 0 0 10px; font-size: 24px; }
        h2 { margin-top: 22px; margin-bottom: 8px; font-size: 16px; color: #6a4b13; border-bottom: 1px solid #d8ccb1; padding-bottom: 4px; }
        p { margin: 0 0 8px; }
        ul { margin: 6px 0 10px 18px; padding: 0; }
        li { margin-bottom: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { border: 1px solid #cfd8df; padding: 8px; vertical-align: top; }
        th { background: #eef3f6; text-align: left; }
        .meta { margin-top: 12px; font-size: 11px; color: #425466; }
    </style>
</head>
<body>
<section class="cover">
    <div class="eyebrow">Business Planning Assistant</div>
    <h1 th:text="${result.title}">보고서 제목</h1>
    <p th:text="${result.summary}">핵심 요약</p>
    <div class="meta">
        <div th:text="'문서 유형: ' + ${result.documentType}"></div>
        <div th:text="'원본 파일: ' + ${fileInfo.originalFileName}"></div>
        <div th:text="'생성 시각: ' + ${#temporals.format(session.updatedAt, 'yyyy-MM-dd HH:mm')}"></div>
    </div>
</section>

<section>
    <h2>목표</h2>
    <ul>
        <li th:each="goal : ${result.goals}" th:text="${goal}"></li>
    </ul>
    <h2>일정 초안</h2>
    <p th:text="${result.scheduleDraft}"></p>
</section>

<section>
    <h2>실행 과제</h2>
    <table>
        <thead>
        <tr>
            <th style="width: 42%;">할 일</th>
            <th style="width: 14%;">우선순위</th>
            <th style="width: 20%;">일정</th>
            <th style="width: 24%;">담당자</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(result.tasks)}">
            <td colspan="4">등록된 실행 과제가 없습니다.</td>
        </tr>
        <tr th:each="task : ${result.tasks}">
            <td th:text="${task.task}"></td>
            <td th:text="${task.priority}"></td>
            <td th:text="${task.dueDate != null ? task.dueDate : '미정'}"></td>
            <td th:text="${task.owner != null ? task.owner : '미정'}"></td>
        </tr>
        </tbody>
    </table>
</section>

<section>
    <h2>리스크</h2>
    <ul>
        <li th:each="risk : ${result.risks}" th:text="${risk}"></li>
    </ul>

    <h2>추가 확인 필요 항목</h2>
    <ul>
        <li th:each="question : ${result.questions}" th:text="${question}"></li>
    </ul>
</section>
</body>
</html>
