<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무계획 도우미</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="landing-body">
<main class="landing-shell">
    <section class="hero-card">
        <p class="eyebrow">Business Planning Assistant</p>
        <h1>문서를 업무계획으로 바꾸는 도구</h1>
        <p class="hero-copy">
            PDF, PPT, PPTX 문서를 업로드하면 AI가 요약, 우선순위 작업, 리스크, 확인 필요 항목을 정리해
            실행 가능한 업무계획 초안을 제공합니다.
        </p>

        <div class="hero-grid">
            <div class="hero-item">
                <strong>1. 업로드</strong>
                <span>문서를 올리고 문서 유형을 선택합니다.</span>
            </div>
            <div class="hero-item">
                <strong>2. AI 분석</strong>
                <span>AI가 문서 내용을 구조화해 실행계획 초안을 만듭니다.</span>
            </div>
            <div class="hero-item">
                <strong>3. 검토 및 수정</strong>
                <span>결과를 확인하고 필요한 항목을 직접 수정할 수 있습니다.</span>
            </div>
        </div>
    </section>

    <section class="upload-card">
        <h2>문서 업로드</h2>

        <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/documents/upload}" th:object="${uploadForm}" method="post" enctype="multipart/form-data">
            <label for="documentType">문서 유형</label>
            <select id="documentType" th:field="*{documentType}">
                <option value="">선택하세요</option>
                <option th:each="type : ${documentTypes}" th:value="${type}" th:text="${type.label}"></option>
            </select>

            <label for="file">파일 업로드</label>
            <input id="file" type="file" th:field="*{file}" accept=".pdf,.ppt,.pptx">

            <p class="help-text">업로드 가능한 최대 파일 크기는 10MB입니다.</p>

            <div class="home-action-row">
                <button type="submit">분석 시작</button>
                <a class="secondary-button" th:href="@{/documents/delete}">분석 결과 관리</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
