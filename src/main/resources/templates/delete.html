<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 결과 관리</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="result-body">
<main class="result-shell manage-shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">Analysis Session Manager</p>
            <h1>분석 결과 관리</h1>
            <p class="subtle">저장된 분석 결과를 선택해서 삭제할 수 있습니다.</p>
        </div>
        <div class="header-actions">
            <a class="secondary-button" th:href="@{/}">홈으로</a>
        </div>
    </header>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="panel" th:if="${sessions == null or sessions.isEmpty()}">
        <h2>저장된 분석 결과가 없습니다.</h2>
        <p class="subtle">문서를 업로드하면 여기에서 저장된 결과를 관리할 수 있습니다.</p>
    </section>

    <form th:if="${sessions != null and !sessions.isEmpty()}" th:action="@{/documents/delete-selected}" method="post" id="deleteForm" class="editor-form">
        <section class="panel manage-toolbar">
            <div class="header-actions">
                <button type="button" class="secondary-button" id="selectAllButton">전체 선택</button>
                <button type="button" class="secondary-button" id="clearSelectionButton">선택 해제</button>
                <button type="submit" class="danger-button manage-danger-button" onclick="return confirmSelectedDelete();">선택 삭제</button>
            </div>
        </section>

        <section class="panel manage-list-panel">
            <div class="session-list">
                <label class="session-row" th:each="session : ${sessions}">
                    <div class="session-select">
                        <input type="checkbox" name="sessionIds" th:value="${session.sessionId}" class="session-checkbox">
                    </div>
                    <div class="session-main">
                        <div class="session-title-row">
                            <strong th:text="${session.analysisResult != null ? session.analysisResult.title : 'Untitled'}">Untitled</strong>
                            <span class="session-type" th:text="${session.analysisResult != null ? session.analysisResult.documentType.label : 'Unknown'}">Unknown</span>
                        </div>
                        <p class="subtle" th:text="${session.storedFileInfo != null ? session.storedFileInfo.originalFileName : 'No file name'}">No file name</p>
                        <div class="session-meta">
                            <span th:text="'Session ID: ' + ${session.sessionId}">Session ID</span>
                            <span th:text="'Created: ' + ${#temporals.format(session.createdAt, 'yyyy-MM-dd HH:mm')}">Created</span>
                            <span th:text="'Chunks: ' + ${session.analyzedChunkCount}">Chunks</span>
                        </div>
                    </div>
                </label>
            </div>
        </section>
    </form>

    <form th:if="${sessions != null and !sessions.isEmpty()}" th:action="@{/documents/delete-all}" method="post" class="panel manage-danger-panel"
          onsubmit="return confirm('저장된 분석 결과를 모두 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.');">
        <div class="manage-danger-copy">
            <h2>전체 삭제</h2>
            <p class="subtle">모든 분석 결과를 한 번에 삭제합니다. 선택 삭제보다 위험하므로 필요한 경우에만 사용하세요.</p>
        </div>
        <button type="submit" class="danger-button manage-danger-button">전체 삭제</button>
    </form>
</main>

<script>
    (() => {
        const selectAllButton = document.getElementById('selectAllButton');
        const clearSelectionButton = document.getElementById('clearSelectionButton');
        const checkboxes = Array.from(document.querySelectorAll('.session-checkbox'));

        if (selectAllButton) {
            selectAllButton.addEventListener('click', () => {
                checkboxes.forEach((checkbox) => {
                    checkbox.checked = true;
                });
            });
        }

        if (clearSelectionButton) {
            clearSelectionButton.addEventListener('click', () => {
                checkboxes.forEach((checkbox) => {
                    checkbox.checked = false;
                });
            });
        }

        window.confirmSelectedDelete = () => {
            const selectedCount = checkboxes.filter((checkbox) => checkbox.checked).length;
            if (selectedCount === 0) {
                alert('삭제할 분석 결과를 하나 이상 선택하세요.');
                return false;
            }
            return confirm(`선택한 ${selectedCount}개의 분석 결과를 삭제하시겠습니까?`);
        };
    })();
</script>
</body>
</html>
