<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${result.title} + ' | AI 분석 결과'">AI 분석 결과</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="result-body">
<main class="result-shell">
    <header class="page-header">
        <div>
            <p class="eyebrow">AI 업무 계획 도우미</p>
            <h1 th:text="${result.title}">결과 제목</h1>
            <p class="subtle">
                <span th:text="${result.documentType.label}"></span>
                <span> | </span>
                <span th:text="${analysisSession.storedFileInfo.originalFileName}"></span>
            </p>
        </div>
        <div class="header-actions">
            <button type="button" class="primary-button" id="editButton">수정하기</button>
            <button type="button" class="secondary-button print-button" id="printButton">인쇄</button>
            <a class="secondary-button" th:href="@{/}">새 문서 업로드</a>
        </div>
    </header>

    <div class="alert success alert-dismissible" th:if="${successMessage}">
        <span th:text="${successMessage}"></span>
        <button type="button" class="alert-close" data-dismiss-alert aria-label="닫기">
            <span aria-hidden="true">+</span>
        </button>
    </div>

    <section class="meta-card">
        <div>
            <strong>파일 크기</strong>
            <span th:text="${analysisSession.formattedFileSize}">0 B</span>
        </div>
        <div>
            <strong>추출 텍스트 길이</strong>
            <span th:text="${#numbers.formatInteger(analysisSession.sourceTextLength, 0, 'COMMA')} + '자'">0자</span>
        </div>
        <div>
            <strong>청크 수</strong>
            <span th:text="${analysisSession.analyzedChunkCount} + '개'">0개</span>
        </div>
    </section>

    <section class="meta-card" th:if="${analysisSession.visualAnalysisStatus}">
        <div>
            <strong>시각 자료 상태</strong>
            <span th:text="${analysisSession.visualAnalysisStatus}">자료 없음</span>
        </div>
        <div>
            <strong>검토 메모</strong>
            <span th:text="${analysisSession.visualAnalysisNote}">추가 확인이 필요합니다.</span>
        </div>
    </section>

    <section class="usage-card">
        <div>
            <strong>사용 목적</strong>
            <p>회의 후속조치 정리, 실행계획 초안 작성, 상급자 보고 전 검토 자료 정리에 활용합니다.</p>
        </div>
        <div>
            <strong>작성 기준</strong>
            <p>원문 근거 중심으로 정리하며, 문서에 명시되지 않은 일정, 담당, 상태는 추정하지 않고 비워두거나 TBD 수준으로 해석합니다.</p>
        </div>
    </section>

    <form class="editor-form" id="resultForm"
          th:action="@{/documents/{sessionId}/update(sessionId=${analysisSession.sessionId})}"
          th:object="${result}" method="post">
        <input type="hidden" th:field="*{documentType}">

        <section class="panel">
            <h2>문서 요약</h2>
            <input type="text" th:field="*{title}" readonly data-editable="true">
            <textarea rows="5" th:field="*{summary}" readonly data-editable="true"></textarea>
        </section>
        <section class="panel">
            <h2>목표</h2>
            <div class="list-grid" th:each="goal, stat : *{goals}">
                <label th:text="${stat.count} + '.'"></label>
                <input type="text" th:field="*{goals[__${stat.index}__]}" readonly data-editable="true">
            </div>
        </section>

        <section class="panel">
            <h2>우선순위 업무</h2>
            <div class="task-card" th:each="task, stat : *{tasks}">
                <label th:text="${stat.count} + '.'"></label>
                <input type="text" th:field="*{tasks[__${stat.index}__].task}" readonly data-editable="true">

                <div class="task-grid">
                    <div>
                        <label>우선순위</label>
                        <select th:field="*{tasks[__${stat.index}__].priority}" disabled data-editable="true">
                            <option value="HIGH">높음</option>
                            <option value="MEDIUM">보통</option>
                            <option value="LOW">낮음</option>
                        </select>
                    </div>
                    <div>
                        <label>상태</label>
                        <select th:field="*{tasks[__${stat.index}__].status}" disabled data-editable="true">
                            <option value="NOT_STARTED">미착수</option>
                            <option value="IN_PROGRESS">진행 중</option>
                            <option value="COMPLETED">완료</option>
                        </select>
                    </div>
                    <div>
                        <label>예정일</label>
                        <input type="text" th:field="*{tasks[__${stat.index}__].dueDate}" readonly data-editable="true">
                    </div>
                    <div>
                        <label>완료일</label>
                        <input type="text" th:field="*{tasks[__${stat.index}__].completedAt}" readonly data-editable="true">
                    </div>
                    <div>
                        <label>담당자</label>
                        <input type="text" th:field="*{tasks[__${stat.index}__].owner}" readonly data-editable="true">
                    </div>
                    <div>
                        <label>최종 확인자</label>
                        <input type="text" th:field="*{tasks[__${stat.index}__].reviewer}" readonly data-editable="true">
                    </div>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2>일정 초안</h2>
            <textarea rows="4" th:field="*{scheduleDraft}" readonly data-editable="true"></textarea>
        </section>

        <section class="panel two-column">
            <div>
                <h2>리스크</h2>
                <div class="list-grid" th:each="risk, stat : *{risks}">
                    <label th:text="${stat.count} + '.'"></label>
                    <input type="text" th:field="*{risks[__${stat.index}__]}" readonly data-editable="true">
                </div>
            </div>
            <div>
                <h2>확인 필요</h2>
                <div class="list-grid" th:each="question, stat : *{questions}">
                    <label th:text="${stat.count} + '.'"></label>
                    <input type="text" th:field="*{questions[__${stat.index}__]}" readonly data-editable="true">
                </div>
            </div>
        </section>

        <div class="submit-row edit-actions hidden" id="editActions">
            <button type="submit" class="primary-button">저장</button>
            <button type="button" class="secondary-button" id="cancelButton">취소</button>
        </div>
    </form>
</main>

<script>
    (() => {
        const form = document.getElementById('resultForm');
        const editButton = document.getElementById('editButton');
        const printButton = document.getElementById('printButton');
        const cancelButton = document.getElementById('cancelButton');
        const editActions = document.getElementById('editActions');
        const editableFields = Array.from(form.querySelectorAll('[data-editable="true"]'));
        const dismissButtons = Array.from(document.querySelectorAll('[data-dismiss-alert]'));

        const snapshot = () => editableFields.map((field) => ({
            field,
            value: field.value,
            disabled: field.disabled,
            readOnly: field.readOnly
        }));

        let originalState = snapshot();

        const setEditMode = (editing) => {
            editableFields.forEach((field) => {
                if (field.tagName === 'SELECT') {
                    field.disabled = !editing;
                } else {
                    field.readOnly = !editing;
                }
                field.classList.toggle('is-editing', editing);
            });

            editButton.classList.toggle('hidden', editing);
            editActions.classList.toggle('hidden', !editing);
            form.classList.toggle('editing', editing);
        };

        editButton.addEventListener('click', () => {
            originalState = snapshot();
            setEditMode(true);
        });

        printButton.addEventListener('click', () => {
            window.print();
        });

        cancelButton.addEventListener('click', () => {
            originalState.forEach((item) => {
                item.field.value = item.value;
                item.field.disabled = item.disabled;
                item.field.readOnly = item.readOnly;
                item.field.classList.remove('is-editing');
            });
            setEditMode(false);
        });

        form.addEventListener('submit', () => {
            editableFields.forEach((field) => {
                if (field.tagName === 'SELECT') {
                    field.disabled = false;
                }
            });
        });

        dismissButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const alert = button.closest('.alert');
                if (alert) {
                    alert.classList.add('hidden');
                }
            });
        });

        setEditMode(false);
    })();
</script>
</body>
</html>
